<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="Segoe UI, Arial, Helvetica, sans-serif"><rect width="1700" height="900" fill="#FFFFFF"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0039A6">Story Map: Author journey on the Unified Editorial Platform</text><text x="850.0" y="92" font-size="19" font-weight="600" fill="#C0187A" text-anchor="middle">Dr. Priya Nair, a postdoctoral chemist in her early 30s, is preparing a manuscript for JACS</text><rect x="30" y="138" width="70" height="224" rx="6" fill="#EEF3FB" stroke="#B4C7E7"/><text transform="translate(72,250) rotate(-90)" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Prepare the MSC</text><rect x="30" y="378" width="70" height="224" rx="6" fill="#EEF3FB" stroke="#B4C7E7"/><text transform="translate(72,490) rotate(-90)" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Integrity and Fitment</text><rect x="30" y="618" width="70" height="224" rx="6" fill="#EEF3FB" stroke="#B4C7E7"/><text transform="translate(72,730) rotate(-90)" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Submit and Track</text><path d="M330,250 H1450" stroke="#BFE3F7" stroke-width="176" fill="none" stroke-linecap="round"/><path d="M1450,250 A120,120 0 0 1 1450,490" stroke="#FBD9B0" stroke-width="176" fill="none"/><path d="M1450,490 H330" stroke="#FBD9B0" stroke-width="176" fill="none"/><path d="M330,490 A120,120 0 0 0 330,730" stroke="#C9E7B4" stroke-width="176" fill="none"/><path d="M330,730 H1450" stroke="#C9E7B4" stroke-width="176" fill="none" stroke-linecap="round"/><text x="450" y="184.0" font-size="16" font-weight="700" fill="#1C7FC0">Step 1: Get the MSC right before I submit</text><text transform="translate(1644.0,370.0) rotate(90)" font-size="16" font-weight="700" fill="#D9822B" text-anchor="middle">Step 2: Know my score and how to fix it</text><text x="450" y="664.0" font-size="16" font-weight="700" fill="#4E9A2E">Step 3: Submit with confidence and stay informed</text><text transform="translate(152.0,610.0) rotate(-90)" font-size="13" font-weight="700" fill="#4E9A2E" text-anchor="middle">Step 3: Submit with confidence</text><g><circle cx="320" cy="250" r="56" fill="#FFFFFF" stroke="#1C7FC0" stroke-width="4"/><circle cx="320" cy="237.7" r="16.8" fill="#1C7FC0"/><path d="M289.2,284.7 Q320,247.2 350.8,284.7 Z" fill="#1C7FC0"/></g><polygon points="432.5,197.0 669.5,197.0 705.5,256.0 669.5,315.0 432.5,315.0 468.5,256.0" fill="#FFF7E6" fill-opacity="0.92" stroke="#1C7FC0" stroke-width="2"/><text x="564" y="242.9" font-size="15" font-weight="600" fill="#7A4B00" text-anchor="middle">Today: unsure which</text><text x="564" y="261.2" font-size="15" font-weight="600" fill="#7A4B00" text-anchor="middle">journal rules apply; a</text><text x="564" y="279.6" font-size="15" font-weight="600" fill="#7A4B00" text-anchor="middle">desk reject costs weeks</text><polygon points="722.5,197.0 959.5,197.0 995.5,256.0 959.5,315.0 722.5,315.0 758.5,256.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#1C7FC0" stroke-width="2"/><text x="854" y="242.9" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Select the target</text><text x="854" y="261.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">journal (cover thumbnail</text><text x="854" y="279.6" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">confirms the choice)</text><polygon points="1012.5,197.0 1249.5,197.0 1285.5,256.0 1249.5,315.0 1012.5,315.0 1048.5,256.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#1C7FC0" stroke-width="2"/><text x="1144" y="252.1" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Download the journal MSC</text><text x="1144" y="270.4" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">template with guidelines</text><polygon points="1302.5,197.0 1539.5,197.0 1575.5,256.0 1539.5,315.0 1302.5,315.0 1338.5,256.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#1C7FC0" stroke-width="2"/><text x="1434" y="242.9" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Upload the .docx and see</text><text x="1434" y="261.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">an organized preview of</text><text x="1434" y="279.6" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">the MSC</text><g><circle cx="1480" cy="490" r="50" fill="#FFFFFF" stroke="#D9822B" stroke-width="4"/><circle cx="1480" cy="479.0" r="15.0" fill="#D9822B"/><path d="M1452.5,521.0 Q1480,487.5 1507.5,521.0 Z" fill="#D9822B"/></g><polygon points="1387.5,437.0 1150.5,437.0 1114.5,496.0 1150.5,555.0 1387.5,555.0 1351.5,496.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#D9822B" stroke-width="2"/><text x="1256" y="482.9" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Format and required</text><text x="1256" y="501.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">details validated</text><text x="1256" y="519.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">(title, authors, ORCID)</text><polygon points="1097.5,437.0 860.5,437.0 824.5,496.0 860.5,555.0 1097.5,555.0 1061.5,496.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#D9822B" stroke-width="2"/><text x="966" y="492.1" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Integrity score 1-10</text><text x="966" y="510.4" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">across 7 weighted checks</text><polygon points="807.5,437.0 570.5,437.0 534.5,496.0 570.5,555.0 807.5,555.0 771.5,496.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#D9822B" stroke-width="2"/><text x="676" y="482.9" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Issues ranked critical /</text><text x="676" y="501.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">major / minor with How</text><text x="676" y="519.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">to fix</text><polygon points="517.5,437.0 280.5,437.0 244.5,496.0 280.5,555.0 517.5,555.0 481.5,496.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#D9822B" stroke-width="2"/><text x="386" y="482.9" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Journal fit % with best-</text><text x="386" y="501.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">fit journal or transfer</text><text x="386" y="519.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">path</text><g><circle cx="320" cy="730" r="50" fill="#FFFFFF" stroke="#4E9A2E" stroke-width="4"/><circle cx="320" cy="719.0" r="15.0" fill="#4E9A2E"/><path d="M292.5,761.0 Q320,727.5 347.5,761.0 Z" fill="#4E9A2E"/></g><polygon points="432.5,677.0 669.5,677.0 705.5,736.0 669.5,795.0 432.5,795.0 468.5,736.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#4E9A2E" stroke-width="2"/><text x="564" y="723.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Score above 6 = PASS</text><text x="564" y="741.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">enables Submit; FAIL</text><text x="564" y="759.6" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">asks for a fix</text><polygon points="722.5,677.0 959.5,677.0 995.5,736.0 959.5,795.0 722.5,795.0 758.5,736.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#4E9A2E" stroke-width="2"/><text x="854" y="723.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">My submissions shows</text><text x="854" y="741.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">status, decision and</text><text x="854" y="759.6" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">reviewer feedback</text><polygon points="1012.5,677.0 1249.5,677.0 1285.5,736.0 1249.5,795.0 1012.5,795.0 1048.5,736.0" fill="#FFFFFF" fill-opacity="0.92" stroke="#4E9A2E" stroke-width="2"/><text x="1144" y="723.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Revise: upload the</text><text x="1144" y="741.2" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">revision and re-check</text><text x="1144" y="759.6" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">before re-submitting</text><rect x="1280" y="668" width="290" height="136" rx="16" fill="#0039A6"/><text x="1420" y="722.1" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">First-time-right submission,</text><text x="1420" y="741.6" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">fewer desk rejects, clear next</text><text x="1420" y="761.1" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">step</text><rect x="130" y="856" width="20" height="14" fill="#FFF7E6" stroke="#1C7FC0"/><text x="158" y="868" font-size="13" fill="#374151">Pain point today</text><rect x="300" y="856" width="20" height="14" fill="#FFFFFF" stroke="#6B7280"/><text x="328" y="868" font-size="13" fill="#374151">Activity supported by the working prototype</text><rect x="660" y="856" width="20" height="14" fill="#0039A6"/><text x="688" y="868" font-size="13" fill="#374151">Outcome for the persona</text><text x="1660" y="868" font-size="12" fill="#6B7280" text-anchor="end">Format adapted from the Group-16 DT empathy journeys (slides 7 and 8)</text></svg>