size="13" font-weight="600" fill="#1730A3" text-anchor="middle" >System: DOTS</text><rect x="30" y="150" width="220" height="300" rx="12" fill="#DDE7F7" stroke="none" /><circle cx="56" cy="180" r="15" fill="#1730A3"/><text x="56" y="185" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="80" y="186" font-size="17" font-weight="700" fill="#1730A3" text-anchor="start" >Upload</text><circle cx="50" cy="217" r="5" fill="#1730A3"/><text x="64" y="222" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Author uploads the</text><text x="64" y="241" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >manuscript</text><circle cx="50" cy="267" r="5" fill="#1730A3"/><text x="64" y="272" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Metadata extracted</text><circle cx="50" cy="298" r="5" fill="#1730A3"/><text x="64" y="303" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Record passes to Paragon</text><text x="64" y="322" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Plus</text><rect x="40" y="398" width="200" height="42" rx="8" fill="#fff" stroke="none" /><text x="140.0" y="423" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Author</text><rect x="294" y="150" width="220" height="300" rx="12" fill="#DDE7F7" stroke="none" /><circle cx="320" cy="180" r="15" fill="#1730A3"/><text x="320" y="185" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="344" y="186" font-size="17" font-weight="700" fill="#1730A3" text-anchor="start" >Compliance checks</text><circle cx="314" cy="217" r="5" fill="#1730A3"/><text x="328" y="222" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >OFAC check vs SDN,</text><text x="328" y="241" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >inclusion and exclusion</text><text x="328" y="260" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >lists</text><circle cx="314" cy="286" r="5" fill="#1730A3"/><text x="328" y="291" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Rights retention (RRS /</text><text x="328" y="310" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >AAM) and federal funder</text><text x="328" y="329" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >check</text><circle cx="314" cy="355" r="5" fill="#1730A3"/><text x="328" y="360" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Hits flagged on the</text><text x="328" y="379" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >manuscript</text><rect x="304" y="398" width="200" height="42" rx="8" fill="#fff" stroke="none" /><text x="404.0" y="423" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >System · Legal and OA lists</text><rect x="558" y="150" width="220" height="300" rx="12" fill="#DDE7F7" stroke="none" /><circle cx="584" cy="180" r="15" fill="#1730A3"/><text x="584" y="185" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="608" y="186" font-size="17" font-weight="700" fill="#1730A3" text-anchor="start" >Ticket validation</text><circle cx="578" cy="217" r="5" fill="#1730A3"/><text x="592" y="222" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >ServiceNow ticket raised</text><text x="592" y="241" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >per hit</text><circle cx="578" cy="267" r="5" fill="#E67E22"/><text x="592" y="272" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Vendor validates: false</text><text x="592" y="291" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >positive, outreach or</text><text x="592" y="310" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >escalate</text><circle cx="578" cy="336" r="5" fill="#E67E22"/><text x="592" y="341" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Portfolio Services and</text><text x="592" y="360" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Legal clear or reject</text><rect x="568" y="398" width="200" height="42" rx="8" fill="#fff" stroke="none" /><text x="668.0" y="416" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Vendor · Portfolio Svcs ·</text><text x="668.0" y="431" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Legal</text><rect x="822" y="150" width="220" height="300" rx="12" fill="#DDE7F7" stroke="none" /><circle cx="848" cy="180" r="15" fill="#1730A3"/><text x="848" y="185" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="872" y="186" font-size="17" font-weight="700" fill="#1730A3" text-anchor="start" >Admin check</text><circle cx="842" cy="217" r="5" fill="#E67E22"/><text x="856" y="222" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >First task: Admin Check</text><text x="856" y="241" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >or Assign EE</text><circle cx="842" cy="267" r="5" fill="#E67E22"/><text x="856" y="272" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Vendor and Manuscript</text><text x="856" y="291" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Admin run admin checks</text><circle cx="842" cy="317" r="5" fill="#E67E22"/><text x="856" y="322" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Missing items put on</text><text x="856" y="341" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >hold; author contacted</text><rect x="832" y="398" width="200" height="42" rx="8" fill="#fff" stroke="none" /><text x="932.0" y="416" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Vendor · Manuscript Admin ·</text><text x="932.0" y="431" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Author</text><rect x="1086" y="150" width="220" height="300" rx="12" fill="#DDE7F7" stroke="none" /><circle cx="1112" cy="180" r="15" fill="#1730A3"/><text x="1112" y="185" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="1136" y="186" font-size="17" font-weight="700" fill="#1730A3" text-anchor="start" >Peer review</text><circle cx="1106" cy="217" r="5" fill="#E67E22"/><text x="1120" y="222" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Editors run review with</text><text x="1120" y="241" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Editorial Support</text><circle cx="1106" cy="267" r="5" fill="#1730A3"/><text x="1120" y="272" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >iThenticate, Fundref,</text><text x="1120" y="291" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >profile and data checks</text><circle cx="1106" cy="317" r="5" fill="#E67E22"/><text x="1120" y="322" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Decision: accept,</text><text x="1120" y="341" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >revise, reject or</text><text x="1120" y="360" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >transfer</text><rect x="1096" y="398" width="200" height="42" rx="8" fill="#fff" stroke="none" /><text x="1196.0" y="423" font-size="12" font-weight="600" fill="#5B6B8C" text-anchor="middle" >Editors · Editorial Support</text><rect x="1350" y="150" width="220" height="300" rx="12" fill="#1730A3" stroke="none" /><circle cx="1376" cy="180" r="15" fill="#fff"/><text x="1376" y="185" font-size="15" font-weight="700" fill="#1730A3" text-anchor="middle" >6</text><text x="1400" y="186" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >To operations</text><circle cx="1370" cy="217" r="5" fill="#9FB4E8"/><text x="1384" y="222" font-size="14" font-weight="400" fill="#fff" text-anchor="start" >Accepted manuscript</text><text x="1384" y="241" font-size="14" font-weight="400" fill="#fff" text-anchor="start" >handed to DOTS</text><circle cx="1370" cy="267" r="5" fill="#9FB4E8"/><text x="1384" y="272" font-size="14" font-weight="400" fill="#fff" text-anchor="start" >Operations takes over</text><rect x="1360" y="398" width="200" height="42" rx="8" fill="#2B45B8" stroke="none" /><text x="1460.0" y="423" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" >Operations</text><path d="M250,300 L292,300" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><path d="M514,300 L556,300" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><path d="M778,300 L820,300" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><path d="M1042,300 L1084,300" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><path d="M1306,300 L1348,300" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><polygon points="536,280 556,300 536,320 516,300" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="536" y="305" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G1</text><polygon points="1064,280 1084,300 1064,320 1044,300" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="1064" y="305" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G2</text><polygon points="1328,280 1348,300 1328,320 1308,300" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="1328" y="305" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G3</text><path d="M404.0,150 L404.0,132 L932.0,132 L932.0,148" fill="none" stroke="#1730A3" stroke-width="2"  marker-end="url(#a1730A3)"/><rect x="548" y="121" width="240" height="22" rx="4" fill="#fff" stroke="none" /><text x="668.0" y="137" font-size="12" font-weight="600" fill="#1730A3" text-anchor="middle" >G1 no hit: straight to Admin Check</text><text x="536" y="340" font-size="12" font-weight="600" fill="#1730A3" text-anchor="middle" >hit</text><rect x="553" y="520" width="230" height="70" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="567" y="548" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" >Rejected by Legal</text><text x="567" y="570" font-size="12.5" font-weight="400" fill="#3A4560" text-anchor="start" >OFAC match confirmed; not cleared</text><path d="M668.0,450 L668.0,518" fill="none" stroke="#C0392B" stroke-width="2"  marker-end="url(#aC0392B)"/><rect x="817" y="520" width="230" height="70" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="831" y="548" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" >Unsubmitted</text><text x="831" y="570" font-size="12.5" font-weight="400" fill="#3A4560" text-anchor="start" >Missing items not corrected</text><path d="M932.0,450 L932.0,518" fill="none" stroke="#C0392B" stroke-width="2"  marker-end="url(#aC0392B)"/><rect x="1131" y="520" width="240" height="70" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="1145" y="548" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start" >Rejected or transferred</text><text x="1145" y="570" font-size="12.5" font-weight="400" fill="#3A4560" text-anchor="start" >Editor decision at G3</text><path d="M1236,450 L1236,518" fill="none" stroke="#C0392B" stroke-width="2"  marker-end="url(#aC0392B)"/><path d="M1116,450 L1116,640 L404.0,640 L404.0,452" fill="none" stroke="#1730A3" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1730A3)"/><rect x="538" y="626" width="520" height="28" rx="6" fill="#fff" stroke="#1730A3" stroke-dasharray="6 4"/><text x="798" y="645" font-size="13" font-weight="600" fill="#1730A3" text-anchor="middle" >Revision or reject-and-resubmit: Full Check, then re-enters the flow</text><text x="932.0" y="510" font-size="1" font-weight="400" fill="#1B2540" text-anchor="start" ></text><rect x="30" y="700" width="1540" height="170" rx="10" fill="#F7F9FD" stroke="#D5DEEE" /><text x="54" y="734" font-size="16" font-weight="700" fill="#1730A3" text-anchor="start" >Decision gates</text><polygon points="70,751 85,766 70,781 55,766" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="70" y="771" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G1</text><text x="96" y="771" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Compliance hit? OFAC list match, or RRS / AAM language or top federal funder</text><polygon points="70,787 85,802 70,817 55,802" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="70" y="807" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G2</text><text x="96" y="807" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Initial (admin) check passed? If not: on hold, author outreach, else unsubmitted</text><polygon points="70,823 85,838 70,853 55,838" fill="#fff" stroke="#1730A3" stroke-width="2.5"/><text x="70" y="843" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle" >G3</text><text x="96" y="843" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Editor decision: accept, revise, reject or transfer</text><text x="860" y="734" font-size="16" font-weight="700" fill="#1730A3" text-anchor="start" >Legend</text><circle cx="870" cy="762" r="6" fill="#1730A3"/><text x="884" y="767" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >System step</text><circle cx="1010" cy="762" r="6" fill="#E67E22"/><text x="1024" y="767" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Manual step (person)</text><rect x="862" y="786" width="26" height="16" rx="3" fill="#FBE9E7" stroke="#C0392B" /><text x="898" y="799" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Leaves the flow</text><path d="M1030,794 L1080,794" fill="none" stroke="#1730A3" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1730A3)"/><text x="1090" y="799" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start" >Loop back into the flow</text><text x="862" y="836" font-size="14" font-weight="600" fill="#E67E22" text-anchor="start" >Manual work concentrates in stages 3 to 5; four systems each hold part of the status.</text><text x="862" y="858" font-size="12.5" font-weight="400" fill="#5B6B8C" text-anchor="start" >Source: Manuscript Flow Publishing TO-BE v1.1, AS-IS slides (GEO workflow board, main flow).</text></svg>