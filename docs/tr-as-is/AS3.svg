<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="Inter"><defs><marker id="a1730A3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1730A3"/></marker><marker id="aC0392B" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="a1E7B4F" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E7B4F"/></marker><marker id="a5B6B8C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B8C"/></marker></defs><rect width="1600" height="620" fill="#fff"/><text x="30" y="44" font-size="26" font-weight="700" fill="#1730A3" text-anchor="start">From AS-IS to the proposed TO-BE: where the gaps close</text><text x="30" y="70" font-size="15" font-weight="400" fill="#5B6B8C" text-anchor="start">Seven AS-IS gaps map to three automation measures; checks move to upload, the ticket queue goes, and editors are selected by rules</text><text x="30" y="112" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start">AS-IS</text><rect x="30" y="124" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="145.0" y="154" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Upload</text><text x="145.0" y="176" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Publishing Center</text><path d="M260,172 L286,172" fill="none" stroke="#5B6B8C" stroke-width="2"  marker-end="url(#a5B6B8C)"/><rect x="288" y="124" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="403.0" y="154" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Compliance checks</text><text x="403.0" y="176" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Paragon Plus</text><path d="M518,172 L544,172" fill="none" stroke="#5B6B8C" stroke-width="2"  marker-end="url(#a5B6B8C)"/><rect x="546" y="124" width="230" height="96" rx="10" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="661.0" y="154" font-size="16" font-weight="700" fill="#C0392B" text-anchor="middle">Ticket validation</text><text x="661.0" y="176" font-size="12.5" font-weight="400" fill="#C0392B" text-anchor="middle">ServiceNow, vendor</text><path d="M776,172 L802,172" fill="none" stroke="#5B6B8C" stroke-width="2"  marker-end="url(#a5B6B8C)"/><rect x="804" y="124" width="230" height="96" rx="10" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.5"/><text x="919.0" y="154" font-size="16" font-weight="700" fill="#C0392B" text-anchor="middle">Admin check</text><text x="919.0" y="176" font-size="12.5" font-weight="400" fill="#C0392B" text-anchor="middle">ServiceNow, vendor,</text><text x="919.0" y="193" font-size="12.5" font-weight="400" fill="#C0392B" text-anchor="middle">Manuscript Admin</text><path d="M1034,172 L1060,172" fill="none" stroke="#5B6B8C" stroke-width="2"  marker-end="url(#a5B6B8C)"/><rect x="1062" y="124" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="1177.0" y="154" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Peer review</text><text x="1177.0" y="176" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Paragon Plus; late checks</text><path d="M1292,172 L1318,172" fill="none" stroke="#5B6B8C" stroke-width="2"  marker-end="url(#a5B6B8C)"/><rect x="1320" y="124" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="1435.0" y="154" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Operations</text><text x="1435.0" y="176" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">DOTS</text><text x="30" y="254" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start">Gaps</text><rect x="95" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="111" cy="249" r="11" fill="#C0392B"/><text x="111" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="205" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Quality checks run late</text><rect x="307" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="323" cy="249" r="11" fill="#C0392B"/><text x="323" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="417" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Manual completeness check</text><rect x="519" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="535" cy="249" r="11" fill="#C0392B"/><text x="535" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="629" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Every hit becomes a ticket</text><rect x="731" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="747" cy="249" r="11" fill="#C0392B"/><text x="747" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="841" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Status split over 4 systems</text><rect x="943" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="959" cy="249" r="11" fill="#C0392B"/><text x="959" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1053" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Too many hand-offs</text><rect x="1155" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="1171" cy="249" r="11" fill="#C0392B"/><text x="1171" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1265" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Manual Assign EE</text><rect x="1367" y="234" width="202" height="30" rx="15" fill="#fff" stroke="#C0392B" stroke-width="1.5"/><circle cx="1383" cy="249" r="11" fill="#C0392B"/><text x="1383" y="254" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1477" y="254" font-size="12.5" font-weight="600" fill="#C0392B" text-anchor="middle">Transfers hard to fix</text><rect x="30" y="318" width="480" height="92" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="270.0" y="348" font-size="17" font-weight="700" fill="#1E7B4F" text-anchor="middle">1  Upfront validation</text><text x="270.0" y="372" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">Generic and journal rules at upload; integrity score; failures</text><text x="270.0" y="389" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">back to the author</text><path d="M196,264 L196,284 L270.0,284 L270.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><path d="M408,264 L408,284 L270.0,284 L270.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="560" y="318" width="480" height="92" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="800.0" y="348" font-size="17" font-weight="700" fill="#1E7B4F" text-anchor="middle">2  Automated acceptance</text><text x="800.0" y="372" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">Accepted or Rejected outcome on the record; exceptions only to</text><text x="800.0" y="389" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">people</text><path d="M620,264 L620,284 L800.0,284 L800.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><path d="M832,264 L832,284 L800.0,284 L800.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><path d="M1044,264 L1044,284 L800.0,284 L800.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="1090" y="318" width="480" height="92" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="1330.0" y="348" font-size="17" font-weight="700" fill="#1E7B4F" text-anchor="middle">3  Triage and routing</text><text x="1330.0" y="372" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">Rules select AE and EE by expertise, capacity, conflicts;</text><text x="1330.0" y="389" font-size="13" font-weight="400" fill="#1B2540" text-anchor="middle">decision and transfer support</text><path d="M1256,264 L1256,284 L1330.0,284 L1330.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><path d="M1468,264 L1468,284 L1330.0,284 L1330.0,316" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><text x="30" y="452" font-size="15" font-weight="700" fill="#1E7B4F" text-anchor="start">TO-BE (proposed)</text><rect x="30" y="460" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="145.0" y="490" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Upload</text><text x="145.0" y="512" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Publishing Center;</text><text x="145.0" y="529" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">metadata extracted</text><path d="M260,508 L286,508" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="288" y="460" width="230" height="96" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="403.0" y="490" font-size="16" font-weight="700" fill="#1E7B4F" text-anchor="middle">Upfront validation</text><text x="403.0" y="512" font-size="12.5" font-weight="400" fill="#1E7B4F" text-anchor="middle">Integrity score vs journal</text><text x="403.0" y="529" font-size="12.5" font-weight="400" fill="#1E7B4F" text-anchor="middle">threshold</text><path d="M518,508 L544,508" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="546" y="460" width="230" height="96" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="661.0" y="490" font-size="16" font-weight="700" fill="#1E7B4F" text-anchor="middle">Automated acceptance</text><text x="661.0" y="512" font-size="12.5" font-weight="400" fill="#1E7B4F" text-anchor="middle">No ticket, no vendor step</text><path d="M776,508 L802,508" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="804" y="460" width="230" height="96" rx="10" fill="#E3F4EA" stroke="#1E7B4F" stroke-width="1.5"/><text x="919.0" y="490" font-size="16" font-weight="700" fill="#1E7B4F" text-anchor="middle">Triage and routing</text><text x="919.0" y="512" font-size="12.5" font-weight="400" fill="#1E7B4F" text-anchor="middle">Auto-selects AE and EE</text><path d="M1034,508 L1060,508" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="1062" y="460" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="1177.0" y="490" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Peer review</text><text x="1177.0" y="512" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Checks already complete</text><path d="M1292,508 L1318,508" fill="none" stroke="#1E7B4F" stroke-width="2"  marker-end="url(#a1E7B4F)"/><rect x="1320" y="460" width="230" height="96" rx="10" fill="#DDE7F7" stroke="none" stroke-width="1.5"/><text x="1435.0" y="490" font-size="16" font-weight="700" fill="#1730A3" text-anchor="middle">Editor decision</text><text x="1435.0" y="512" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">Accept, revise, reject,</text><text x="1435.0" y="529" font-size="12.5" font-weight="400" fill="#1730A3" text-anchor="middle">transfer</text><text x="800" y="592" font-size="14" font-weight="600" fill="#1730A3" text-anchor="middle">One record and one status from Publishing Center to DOTS; an authorized Editor still makes the scientific and editorial decision.</text></svg>