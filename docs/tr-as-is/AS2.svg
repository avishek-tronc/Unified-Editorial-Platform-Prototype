<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="916" viewBox="0 0 1600 916" font-family="Inter"><rect width="1600" height="916" fill="#fff"/><text x="30" y="44" font-size="26" font-weight="700" fill="#1730A3" text-anchor="start">Triage and Routing: AS-IS persona view (who does what)</text><text x="30" y="70" font-size="15" font-weight="400" fill="#5B6B8C" text-anchor="start">Seven roles share the flow; the vendor team, Manuscript Admin and the Author carry most of the manual work before peer review</text><rect x="270" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="370.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Submit</text><rect x="478" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="578.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Screen</text><rect x="686" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="786.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Validate</text><rect x="894" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="994.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Admin check</text><rect x="1102" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="1202.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Peer review</text><rect x="1310" y="90" width="200" height="34" rx="6" fill="#1730A3" stroke="none" /><text x="1410.0" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Decision and handoff</text><rect x="1524" y="90" width="46" height="34" rx="6" fill="#E8ECF5" stroke="none" /><text x="1547.0" y="112" font-size="12" font-weight="700" fill="#1730A3" text-anchor="middle">Manual</text><rect x="30" y="134" width="1540" height="96" rx="8" fill="#F7F9FD" stroke="#E1E7F2" /><text x="44" y="164" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Author</text><text x="44" y="182" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Submits; fixes and revises</text><rect x="276" y="144" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="370.0" y="179.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Uploads manuscript in</text><text x="370.0" y="195.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Publishing Center</text><rect x="692" y="144" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="786.0" y="179.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Answers outreach on RRS /</text><text x="786.0" y="195.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">AAM language</text><rect x="900" y="144" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="994.0" y="179.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Corrects missing items, or</text><text x="994.0" y="195.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">is unsubmitted</text><rect x="1316" y="144" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1410.0" y="179.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Revises or resubmits after</text><text x="1410.0" y="195.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">the decision</text><circle cx="1547.0" cy="182.0" r="20" fill="#E67E22"/><text x="1547.0" y="188.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="30" y="238" width="1540" height="96" rx="8" fill="#fff" stroke="#E1E7F2" /><text x="44" y="268" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Systems</text><text x="44" y="286" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Publishing Center, Paragon</text><text x="44" y="302" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Plus, ServiceNow, DOTS</text><rect x="276" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="370.0" y="275.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Publishing Center extracts</text><text x="370.0" y="291.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">metadata; Paragon Plus</text><text x="370.0" y="307.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">opens record</text><rect x="484" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="578.0" y="275.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Paragon Plus runs OFAC and</text><text x="578.0" y="291.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">RRS / funder checks; flags</text><text x="578.0" y="307.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">hits</text><rect x="692" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="786.0" y="283.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">ServiceNow ticket raised</text><text x="786.0" y="299.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">for each hit</text><rect x="900" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="994.0" y="283.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">ServiceNow first task:</text><text x="994.0" y="299.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Admin Check or Assign EE</text><rect x="1108" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="1202.0" y="283.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">iThenticate, Fundref and</text><text x="1202.0" y="299.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">data checks</text><rect x="1316" y="248" width="188" height="76" rx="8" fill="#1730A3" stroke="none" /><text x="1410.0" y="283.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Accepted manuscript handed</text><text x="1410.0" y="299.0" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">to DOTS</text><circle cx="1547.0" cy="286.0" r="20" fill="#E8ECF5"/><text x="1547.0" y="292.0" font-size="17" font-weight="700" fill="#1730A3" text-anchor="middle">0</text><rect x="30" y="342" width="1540" height="96" rx="8" fill="#F7F9FD" stroke="#E1E7F2" /><text x="44" y="372" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Vendor team</text><text x="44" y="390" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Ticket and admin-check desk</text><rect x="692" y="352" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="786.0" y="379.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Validates ticket: false</text><text x="786.0" y="395.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">positive, outreach or</text><text x="786.0" y="411.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">escalate</text><rect x="900" y="352" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="994.0" y="387.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Performs the manuscript</text><text x="994.0" y="403.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">admin checks</text><rect x="1108" y="352" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1202.0" y="387.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Re-runs iThenticate; checks</text><text x="1202.0" y="403.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">funding data on revisions</text><circle cx="1547.0" cy="390.0" r="20" fill="#E67E22"/><text x="1547.0" y="396.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="30" y="446" width="1540" height="96" rx="8" fill="#fff" stroke="#E1E7F2" /><text x="44" y="476" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Portfolio Services and</text><text x="44" y="494" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">ACS Legal</text><text x="44" y="512" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Escalations and sanctions</text><text x="44" y="528" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">lists</text><rect x="484" y="456" width="188" height="76" rx="8" fill="#fff" stroke="#1730A3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="578.0" y="483.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">Legal maintains SDN,</text><text x="578.0" y="499.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">inclusion and exclusion</text><text x="578.0" y="515.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">lists</text><rect x="692" y="456" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="786.0" y="491.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Triage new or existing use</text><text x="786.0" y="507.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">case; clear or reject</text><circle cx="1547.0" cy="494.0" r="20" fill="#F5C48F"/><text x="1547.0" y="500.0" font-size="17" font-weight="700" fill="#1730A3" text-anchor="middle">1</text><rect x="30" y="550" width="1540" height="96" rx="8" fill="#F7F9FD" stroke="#E1E7F2" /><text x="44" y="580" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Open Access and Sales</text><text x="44" y="598" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Ops</text><text x="44" y="616" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Funder and AAM reference data</text><rect x="484" y="560" width="188" height="76" rx="8" fill="#fff" stroke="#1730A3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="578.0" y="587.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">Maintains technical sheet:</text><text x="578.0" y="603.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">federal funders, AAM</text><text x="578.0" y="619.0" font-size="12.5" font-weight="500" fill="#1730A3" text-anchor="middle">language</text><circle cx="1547.0" cy="598.0" r="20" fill="#E8ECF5"/><text x="1547.0" y="604.0" font-size="17" font-weight="700" fill="#1730A3" text-anchor="middle">0</text><rect x="30" y="654" width="1540" height="96" rx="8" fill="#fff" stroke="#E1E7F2" /><text x="44" y="684" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Manuscript Admin and</text><text x="44" y="702" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Editorial Support</text><text x="44" y="720" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Completeness and profile</text><text x="44" y="736" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">checks</text><rect x="900" y="664" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="994.0" y="691.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Checks submission; holds</text><text x="994.0" y="707.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">and contacts author if</text><text x="994.0" y="723.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">items are missing</text><rect x="1108" y="664" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1202.0" y="691.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Profile validation: author</text><text x="1202.0" y="707.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">lists, ORCID, emails,</text><text x="1202.0" y="723.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">reviewer badges</text><rect x="1316" y="664" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1410.0" y="699.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Full Check on revised</text><text x="1410.0" y="715.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">manuscripts</text><circle cx="1547.0" cy="702.0" r="20" fill="#E67E22"/><text x="1547.0" y="708.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="30" y="758" width="1540" height="96" rx="8" fill="#F7F9FD" stroke="#E1E7F2" /><text x="44" y="788" font-size="15" font-weight="700" fill="#1730A3" text-anchor="start">Editors (EE / AE)</text><text x="44" y="806" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">Scientific and editorial</text><text x="44" y="822" font-size="12" font-weight="400" fill="#5B6B8C" text-anchor="start">decision</text><rect x="1108" y="768" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1202.0" y="811.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Run peer review</text><rect x="1316" y="768" width="188" height="76" rx="8" fill="#DDE7F7" stroke="#9FB4E8" stroke-width="1"/><text x="1410.0" y="803.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">Decide: accept, revise,</text><text x="1410.0" y="819.0" font-size="12.5" font-weight="500" fill="#1B2540" text-anchor="middle">reject or transfer</text><circle cx="1547.0" cy="806.0" r="20" fill="#F5C48F"/><text x="1547.0" y="812.0" font-size="17" font-weight="700" fill="#1730A3" text-anchor="middle">2</text><rect x="30" y="876" width="24" height="16" rx="3" fill="#1730A3" stroke="none" /><text x="62" y="889" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start">System step</text><rect x="190" y="876" width="24" height="16" rx="3" fill="#DDE7F7" stroke="#9FB4E8" /><text x="222" y="889" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start">Manual step</text><rect x="350" y="876" width="24" height="16" rx="3" fill="#fff" stroke="#1730A3" stroke-dasharray="4 3"/><text x="382" y="889" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start">Reference data</text><circle cx="540" cy="884" r="9" fill="#E67E22"/><text x="556" y="889" font-size="14" font-weight="400" fill="#1B2540" text-anchor="start">Manual steps per role (3 or more highlighted)</text><text x="1570" y="889" font-size="12.5" font-weight="400" fill="#5B6B8C" text-anchor="end">Source: Manuscript Flow Publishing TO-BE v1.1, slide &quot;Who Does What&quot; (GEO workflow board in Miro, main flow)</text></svg>